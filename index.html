
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp mời của tôi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee8df;
            font-family: Georgia, serif;
            padding: 20px;
        }

        .card {
            max-width: 430px;
            width: 100%;
            background: #fffdf8;
            text-align: center;
            padding: 50px 30px;
            border: 1px solid #d8c5aa;
            outline: 5px double #d8c5aa;
            outline-offset: -12px;
            box-shadow: 0 12px 40px #00000015;
        }

        .subtitle {
            color: #a58259;
            letter-spacing: 4px;
            font-size: 12px;
        }

        h1 {
            font-size: 42px;
            font-weight: normal;
            color: #73583e;
            margin: 22px 0;
        }

        .description {
            color: #776b5d;
            line-height: 1.8;
        }

        .info {
            margin: 30px 0;
            padding: 20px;
            border-top: 1px solid #dfd1bd;
            border-bottom: 1px solid #dfd1bd;
            color: #73583e;
            line-height: 2;
        }

        button {
            background: #8b7053;
            color: white;
            padding: 13px 28px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
        }

        button:hover {
            background: #604a35;
        }
    </style>
</head>

<body>
    <main class="card">
        <p class="subtitle">YOU ARE INVITED</p>

        <h1>Birthday Party</h1>

        <p class="description">
            djtmemay
        </p>

        <div class="info">
            <div>📅 Ngày: 28/04/2026</div>
            <div>⏰ Giờ: 18:00</div>
            <div>📍 Địa điểm: LienPhong</div>
        </div>

        <p class="description">
            Sự hiện diện của bạn là niềm vui
            của chúng tôi!
        </p>

        <button onclick="alert('Cảm ơn bạn! Hẹn gặp tại buổi tiệc nhé!')">
            Xác nhận tham dự
        </button>
    </main>
</body>
</html>
